plugins {
    id 'com.android.library'
}

def SettingsLibLayoutPreference = '../fwb/packages/SettingsLib/LayoutPreference'

android {
    namespace 'com.android.settingslib.widget.preference.layout'

    defaultConfig {
        minSdk 23
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    sourceSets {
        main {
            res.srcDirs = ["${SettingsLibLayoutPreference}/res"]
            java.srcDirs = ["${SettingsLibLayoutPreference}/src"]
        }
    }
}

dependencies {
    implementation libs.preference
    implementation project(':SettingsLib:SettingsTheme')
}
