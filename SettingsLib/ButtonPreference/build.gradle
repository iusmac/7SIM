plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def SettingsLibButtonPreference = '../fwb/packages/SettingsLib/ButtonPreference'

android {
    namespace 'com.android.settingslib.widget.preference.button'

    defaultConfig {
        minSdk 21
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    sourceSets {
        main {
            res.srcDirs = ["${SettingsLibButtonPreference}/res"]
            java.srcDirs = ["${SettingsLibButtonPreference}/src"]
        }
    }
}

dependencies {
    implementation libs.material
    implementation libs.preference
    implementation project(':SettingsLib:SettingsTheme')
}
